name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# No job here writes to the repo, the API, or the package registry.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install (without optional ML runtimes)
        run: npm ci --omit=optional --no-audit --no-fund

      # Jest 30 resolves modules through unrs-resolver, whose native binding is
      # an *optional* dependency and therefore missing after --omit=optional. It
      # installs itself on first use, but on Node 18 that first use still fails
      # ("testRunner ... was not found") and only the next run works. Trigger
      # the self-install here so the test step starts with the binding in place.
      - name: Install the test resolver's native binding
        run: node -e "try { require('unrs-resolver') } catch (e) { console.log('binding installed on first use') }"

      - name: Run unit tests
        run: npm test

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install (without optional ML runtimes)
        run: npm ci --omit=optional --no-audit --no-fund

      # See the test job: the resolver binding must be in place before jest runs.
      - name: Install the test resolver's native binding
        run: node -e "try { require('unrs-resolver') } catch (e) { console.log('binding installed on first use') }"

      - name: Run coverage
        run: npm run test:coverage

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install (without optional ML runtimes)
        run: npm ci --omit=optional --no-audit --no-fund

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

  audit:
    runs-on: ubuntu-latest
    # Hard gate on the REQUIRED runtime deps. optionalDependencies (tfjs-node,
    # onnxruntime, aws-sdk, ws) carry their own upstream security stories — the
    # remaining tar/node-pre-gyp highs live exclusively in tfjs-node's native
    # install tooling and never reach a user who skips the optional runtime.
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install (without optional ML runtimes)
        run: npm ci --omit=optional --no-audit --no-fund

      - name: npm audit (required deps, fail on high)
        run: npm audit --omit=dev --omit=optional --audit-level=high

  # Smoke test with optional ML runtimes installed. Allowed to fail (some
  # native deps are platform-specific) but its output is visible in the run.
  optional-runtimes:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install (with optional ML runtimes)
        run: npm ci --no-audit --no-fund

      - name: ONNX smoke test
        run: npm run test:smoke-onnx

      - name: Full test suite (incl. optional code paths)
        run: npm test
