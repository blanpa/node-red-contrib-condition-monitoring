version: 2
updates:
  # JavaScript / npm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: "development"
      runtime-dependencies:
        dependency-type: "production"
    ignore:
      # Heavy native runtimes — bump them deliberately, not on a weekly cadence.
      - dependency-name: "@tensorflow/tfjs-node"
      - dependency-name: "onnxruntime-node"
      # node-red 5 needs Node >= 22.9; this package supports and tests Node 18
      # and 20, and the integration harness hangs on v5. Minor/patch updates
      # of the 4.x line still come through.
      - dependency-name: "node-red"
        update-types: ["version-update:semver-major"]

  # GitHub Actions versions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3

  # Docker base images
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
