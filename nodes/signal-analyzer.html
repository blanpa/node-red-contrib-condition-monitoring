<script type="text/javascript">
    RED.nodes.registerType('signal-analyzer', {
        category: 'Condition Monitoring Stats',
        color: '#9482f1',
        defaults: {
            name: { value: "" },
            mode: { value: "fft" },
            windowSize: { value: 256 },
            fftSize: { value: 256 },
            samplingRate: { value: 1000 },
            peakThreshold: { value: 0.1 },
            outputFormat: { value: "peaks" },
            windowFunction: { value: "hann" },
            overlapPercent: { value: 50 },
            minPeakHeight: { value: "" },
            minPeakDistance: { value: 5 },
            peakType: { value: "both" },
            vibInputUnit: { value: "mm_s" },
            iso10816Class: { value: "group2_rigid" },
            // Envelope analysis settings
            envelopeBandLow: { value: 500 },
            envelopeBandHigh: { value: 5000 },
            envelopePeakFloor: { value: 8 },
            bearingBPFO: { value: "" },
            bearingBPFI: { value: "" },
            bearingBSF: { value: "" },
            bearingFTF: { value: "" },
            bearingBalls: { value: "" },
            bearingBallDiameter: { value: "" },
            bearingPitchDiameter: { value: "" },
            bearingContactAngle: { value: "" },
            shaftSpeed: { value: "" },
            // Cepstrum analysis settings
            quefrencyRangeLow: { value: 0.001 },
            quefrencyRangeHigh: { value: 0.1 },
            gearToothCount: { value: "" },
            gearSerThreshold: { value: 1 },
            cepstrumThreshold: { value: 0.1 },
            outputTopic: { value: "" },
            groupBy: { value: "" },
            maxGroups: { value: 50 },
            debug: { value: false },
            persistState: { value: false }
        },
        inputs: 1,
        outputs: 2,
        outputLabels: ["normal", "anomaly/peak"],
        icon: "icon.png",
        label: function() {
            return this.name || "Signal Analyzer";
        },
        labelStyle: function() {
            return this.name ? "node_label_italic" : "";
        },
        paletteLabel: "Signal Analyzer",
        oneditprepare: function() {
            function showModeConfig(mode) {
                $(".mode-config").hide();
                $("#config-" + mode).show();
            }
            
            $("#node-input-mode").on("change", function() {
                showModeConfig($(this).val());
            });
            
            showModeConfig(this.mode || "fft");

            // The shaft speed is one setting shown in two mode panels. Only one
            // element may carry the node-input id (a duplicate id is never read
            // back on save), so the cepstrum panel mirrors the real field.
            var shaftSpeed = $("#node-input-shaftSpeed");
            var shaftSpeedMirror = $("#cm-cepstrum-shaftSpeed");
            shaftSpeedMirror.val(shaftSpeed.val());
            shaftSpeedMirror.on("change input", function() { shaftSpeed.val($(this).val()); });
            shaftSpeed.on("change input", function() { shaftSpeedMirror.val($(this).val()); });
            
            $(".cm-section-header").on("click", function() {
                var $content = $(this).next(".cm-section-content");
                var $icon = $(this).find(".cm-collapse-icon");
                $content.slideToggle(200);
                $icon.toggleClass("fa-chevron-down fa-chevron-up");
            });
        }
    });
</script>

<style>
    .cm-section { background: #fafafa; border: 1px solid #e0e0e0; border-radius: 6px; margin-bottom: 12px; overflow: hidden; }
    .cm-section-header { background: linear-gradient(135deg, #9482f1 0%, #7d6bd3 100%); color: #fff; padding: 10px 14px; font-weight: 500; cursor: pointer; display: flex; align-items: center; justify-content: space-between; }
    .cm-section-header:hover { background: linear-gradient(135deg, #a896f5 0%, #9482f1 100%); }
    .cm-section-content { padding: 14px; }
    .cm-config-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .cm-config-item { display: flex; flex-direction: column; }
    .cm-config-item label { font-size: 11px; color: #666; margin-bottom: 6px; font-weight: 500; }
    .cm-config-item input, .cm-config-item select { padding: 8px 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; }
    .cm-help-text { font-size: 10px; color: #888; margin-top: 4px; }
    .mode-config { display: none; margin-top: 12px; padding-top: 12px; border-top: 1px dashed #ddd; }
</style>

<script type="text/html" data-template-name="signal-analyzer">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="Name">
    </div>
    
    <div class="cm-section">
        <div class="cm-section-header">
            <span><i class="fa fa-wave-square"></i> Analysis Mode</span>
            <i class="fa fa-chevron-down cm-collapse-icon"></i>
        </div>
        <div class="cm-section-content">
            <div class="cm-config-item">
                <label for="node-input-mode"><i class="fa fa-chart-line"></i> Mode</label>
                <select id="node-input-mode">
                    <option value="fft" selected>FFT (Frequency Analysis)</option>
                    <option value="vibration">Vibration Features</option>
                    <option value="peaks">Peak Detection</option>
                    <option value="envelope">Envelope Analysis (Bearing Faults)</option>
                    <option value="cepstrum">Cepstrum Analysis (Gearbox Faults)</option>
                </select>
                <div class="cm-help-text">Select the signal analysis mode</div>
            </div>
            
            <div class="cm-config-item" style="margin-top: 12px;">
                <label for="node-input-windowSize"><i class="fa fa-window-maximize"></i> Window Size (default: 256)</label>
                <input type="number" id="node-input-windowSize" min="8" value="256">
                <div class="cm-help-text">Number of samples to analyze</div>
            </div>
            
            <!-- FFT Config -->
            <div id="config-fft" class="mode-config">
                <h4><i class="fa fa-chart-bar"></i> FFT Settings</h4>
                <div class="cm-config-grid">
                    <div class="cm-config-item">
                        <label>FFT Size</label>
                        <select id="node-input-fftSize">
                            <option value="64">64</option>
                            <option value="128">128</option>
                            <option value="256">256</option>
                            <option value="512">512</option>
                            <option value="1024">1024</option>
                            <option value="2048">2048</option>
                        </select>
                    </div>
                    <div class="cm-config-item">
                        <label>Sampling Rate (default: 1000 Hz)</label>
                        <input type="number" id="node-input-samplingRate" min="1" value="1000">
                    </div>
                    <div class="cm-config-item">
                        <label>Window Function</label>
                        <select id="node-input-windowFunction">
                            <option value="hann">Hann (default)</option>
                            <option value="hamming">Hamming</option>
                            <option value="blackman">Blackman</option>
                            <option value="rectangular">Rectangular (none)</option>
                        </select>
                        <div class="cm-help-text">Window function to reduce spectral leakage</div>
                    </div>
                    <div class="cm-config-item">
                        <label>Overlap (%)</label>
                        <input type="number" id="node-input-overlapPercent" min="0" max="90" value="50">
                        <div class="cm-help-text">Overlap between consecutive analyses of a sample-by-sample stream (0-90%): 50 % = one result every half FFT size. Array payloads are analysed once per message.</div>
                    </div>
                    <div class="cm-config-item">
                        <label>Peak Threshold (default: 0.1)</label>
                        <input type="number" id="node-input-peakThreshold" step="0.01" min="0" max="1" value="0.1">
                    </div>
                    <div class="cm-config-item">
                        <label>Output Format</label>
                        <select id="node-input-outputFormat">
                            <option value="peaks">Peaks Only</option>
                            <option value="full">Full Spectrum</option>
                        </select>
                    </div>
                </div>
            </div>
            
            <!-- Vibration Config -->
            <div id="config-vibration" class="mode-config">
                <h4><i class="fa fa-vibrate"></i> Vibration Settings</h4>
                <div class="cm-config-grid">
                    <div class="cm-config-item">
                        <label><i class="fa fa-ruler"></i> Input Data Unit</label>
                        <select id="node-input-vibInputUnit">
                            <option value="mm_s" selected>Velocity (mm/s) - ISO 20816 native</option>
                            <option value="m_s">Velocity (m/s)</option>
                            <option value="g">Acceleration (g)</option>
                            <option value="m_s2">Acceleration (m/s²)</option>
                            <option value="raw">Raw/Dimensionless (ISO rating disabled)</option>
                        </select>
                        <div class="cm-help-text">Unit of incoming vibration data. Acceleration is integrated to velocity over 10–1000 Hz using the configured sampling rate.</div>
                    </div>
                </div>
                <div class="cm-config-grid" style="margin-top: 10px;">
                    <div class="cm-config-item">
                        <label><i class="fa fa-industry"></i> ISO 20816-3 Machine Group</label>
                        <select id="node-input-iso10816Class">
                            <optgroup label="ISO 20816-3 (industrial machines > 15 kW)">
                                <option value="group1_rigid">Group 1: large machines 300 kW – 50 MW, rigid foundation</option>
                                <option value="group1_flexible">Group 1: large machines 300 kW – 50 MW, flexible foundation</option>
                                <option value="group2_rigid" selected>Group 2: medium machines 15 – 300 kW, rigid foundation</option>
                                <option value="group2_flexible">Group 2: medium machines 15 – 300 kW, flexible foundation</option>
                            </optgroup>
                            <optgroup label="ISO 10816-1 / ISO 2372 classes (legacy)">
                                <option value="class1">Class I: small machines up to 15 kW</option>
                                <option value="class2">Class II: medium machines 15 – 75 kW</option>
                                <option value="class3">Class III: large machines, rigid foundation</option>
                                <option value="class4">Class IV: large machines, flexible foundation</option>
                            </optgroup>
                        </select>
                        <div class="cm-help-text">Zone table for the vibration severity rating. Rigid: foundation natural frequency above the main excitation; flexible: below.</div>
                    </div>
                </div>
                <div class="cm-info-box" style="margin-top: 10px;">
                    <i class="fa fa-info-circle"></i>
                    <b>ISO 20816-3:</b> Vibration severity evaluation based on broadband RMS velocity (mm/s, 10–1000 Hz), zones A–D.
                    Select the correct input unit above.
                    <br><b>Acceleration input:</b> waveform frames (array payloads of at least 16 samples, sampling rate above 20 Hz) are integrated to velocity bin-wise in the frequency domain; scalar streams use the single-frequency relation v = a / (2πf) at the shaft frequency.
                    </div>
            </div>
            
            <!-- Peak Detection Config -->
            <div id="config-peaks" class="mode-config">
                <h4><i class="fa fa-arrow-up"></i> Peak Detection Settings</h4>
                <div class="cm-config-grid">
                    <div class="cm-config-item">
                        <label>Minimum Peak Height</label>
                        <input type="number" id="node-input-minPeakHeight" step="any" placeholder="auto">
                        <div class="cm-help-text">Leave empty for automatic (mean ± 2σ of the window)</div>
                    </div>
                    <div class="cm-config-item">
                        <label>Minimum Peak Distance (default: 5)</label>
                        <input type="number" id="node-input-minPeakDistance" min="1" value="5">
                        <div class="cm-help-text">Minimum samples between peaks</div>
                    </div>
                    <div class="cm-config-item">
                        <label>Peak Type</label>
                        <select id="node-input-peakType">
                            <option value="both">Both (Max & Min)</option>
                            <option value="positive">Positive (Maxima)</option>
                            <option value="negative">Negative (Minima)</option>
                        </select>
                    </div>
                </div>
            </div>
            
            <!-- Envelope Analysis Config -->
            <div id="config-envelope" class="mode-config">
                <h4><i class="fa fa-heartbeat"></i> Envelope Analysis (Bearing Fault Detection)</h4>
                <p style="font-size: 11px; color: #666; margin-bottom: 12px;">
                    Detects bearing faults (BPFO, BPFI, BSF, FTF) using envelope spectrum analysis.
                </p>
                <div class="cm-config-grid">
                    <div class="cm-config-item">
                        <label>Band Low (Hz)</label>
                        <input type="number" id="node-input-envelopeBandLow" min="1" value="500">
                        <div class="cm-help-text">Lower cutoff frequency for bandpass</div>
                    </div>
                    <div class="cm-config-item">
                        <label>Band High (Hz)</label>
                        <input type="number" id="node-input-envelopeBandHigh" min="1" value="5000">
                        <div class="cm-help-text">Upper cutoff frequency for bandpass</div>
                    </div>
                    <div class="cm-config-item">
                        <label>Peak Floor (× noise)</label>
                        <input type="number" id="node-input-envelopePeakFloor" min="1" step="any" placeholder="8">
                        <div class="cm-help-text">A line must exceed this multiple of the local spectral noise floor. 8 = no noise peaks; lower for weaker early defects.</div>
                    </div>
                    <div class="cm-config-item">
                        <label>Shaft Speed (RPM)</label>
                        <input type="number" id="node-input-shaftSpeed" min="0" step="any" placeholder="e.g. 1800">
                        <div class="cm-help-text">Default rotation speed. Override per message with <code>msg.rpm</code> for variable-speed drives.</div>
                    </div>
                </div>
                <h5 style="margin-top: 16px; color: #666;"><i class="fa fa-circle-o"></i> Bearing Geometry (derives the fault frequencies)</h5>
                <div class="cm-config-grid">
                    <div class="cm-config-item">
                        <label>Rolling Elements (n)</label>
                        <input type="number" id="node-input-bearingBalls" min="0" step="1" placeholder="e.g. 9">
                    </div>
                    <div class="cm-config-item">
                        <label>Element Diameter d</label>
                        <input type="number" id="node-input-bearingBallDiameter" min="0" step="any" placeholder="e.g. 7.94">
                    </div>
                    <div class="cm-config-item">
                        <label>Pitch Diameter D</label>
                        <input type="number" id="node-input-bearingPitchDiameter" min="0" step="any" placeholder="e.g. 39.04">
                        <div class="cm-help-text">Same unit as d</div>
                    </div>
                    <div class="cm-config-item">
                        <label>Contact Angle α (°)</label>
                        <input type="number" id="node-input-bearingContactAngle" min="0" max="90" step="any" placeholder="0">
                    </div>
                </div>
                <h5 style="margin-top: 16px; color: #666;"><i class="fa fa-cog"></i> Bearing Fault Frequencies (Hz) — optional, override the derived values</h5>
                <div class="cm-config-grid">
                    <div class="cm-config-item">
                        <label>BPFO (Outer Race)</label>
                        <input type="number" id="node-input-bearingBPFO" min="0" step="any" placeholder="e.g. 89.2">
                    </div>
                    <div class="cm-config-item">
                        <label>BPFI (Inner Race)</label>
                        <input type="number" id="node-input-bearingBPFI" min="0" step="any" placeholder="e.g. 130.8">
                    </div>
                    <div class="cm-config-item">
                        <label>BSF (Ball Spin)</label>
                        <input type="number" id="node-input-bearingBSF" min="0" step="any" placeholder="e.g. 58.3">
                    </div>
                    <div class="cm-config-item">
                        <label>FTF (Cage)</label>
                        <input type="number" id="node-input-bearingFTF" min="0" step="any" placeholder="e.g. 11.5">
                    </div>
                </div>
                <div style="margin-top: 12px; padding: 10px; background: #e3f2fd; border-radius: 4px; font-size: 11px;">
                    <i class="fa fa-info-circle" style="color: #1976d2;"></i>
                    <strong>How the frequencies are resolved:</strong> a typed-in value wins; anything left empty is derived
                    from the geometry and the current shaft speed (BPFO = n/2 · f<sub>r</sub> · (1 − d/D · cos α), BPFI = n/2 · f<sub>r</sub> · (1 + d/D · cos α),
                    BSF = D/2d · f<sub>r</sub> · (1 − (d/D · cos α)²), FTF = f<sub>r</sub>/2 · (1 − d/D · cos α)). Output <code>bearingFreqs.source</code> says which.
                </div>
            </div>
            
            <!-- Cepstrum Analysis Config -->
            <div id="config-cepstrum" class="mode-config">
                <h4><i class="fa fa-cogs"></i> Cepstrum Analysis (Gearbox Fault Detection)</h4>
                <p style="font-size: 11px; color: #666; margin-bottom: 12px;">
                    Detects periodic patterns in the frequency spectrum, ideal for gear mesh frequency and sidebands.
                </p>
                <div class="cm-config-grid">
                    <div class="cm-config-item">
                        <label>Quefrency Range Low (sec)</label>
                        <input type="number" id="node-input-quefrencyRangeLow" min="0.0001" step="0.001" value="0.001">
                        <div class="cm-help-text">Minimum quefrency to analyze (0.001 = 1ms)</div>
                    </div>
                    <div class="cm-config-item">
                        <label>Quefrency Range High (sec)</label>
                        <input type="number" id="node-input-quefrencyRangeHigh" min="0.001" step="0.01" value="0.1">
                        <div class="cm-help-text">Maximum quefrency to analyze (0.1 = 100ms)</div>
                    </div>
                    <div class="cm-config-item">
                        <label>Peak Threshold (0-1)</label>
                        <input type="number" id="node-input-cepstrumThreshold" min="0.01" max="1" step="0.01" value="0.1">
                        <div class="cm-help-text">Minimum normalized peak height (default: 0.1 = 10%)</div>
                    </div>
                </div>
                <h5 style="margin-top: 16px; color: #666;"><i class="fa fa-tachometer"></i> Shaft Configuration</h5>
                <div class="cm-config-grid">
                    <div class="cm-config-item">
                        <label>Shaft Speed (RPM)</label>
                        <input type="number" id="cm-cepstrum-shaftSpeed" min="0" step="any" placeholder="e.g. 1800">
                        <div class="cm-help-text">Shaft speed for the gear-mesh calculation (same setting as in envelope mode). Required for gear diagnosis; override per message with <code>msg.rpm</code>.</div>
                    </div>
                </div>
                <h5 style="margin-top: 16px; color: #666;"><i class="fa fa-cog"></i> Gear Configuration</h5>
                <div class="cm-config-grid">
                    <div class="cm-config-item">
                        <label>Gear Tooth Count</label>
                        <input type="text" id="node-input-gearToothCount" placeholder="e.g., 20,45,18">
                        <div class="cm-help-text">Comma-separated tooth counts of the gears on this shaft</div>
                    </div>
                    <div class="cm-config-item">
                        <label>Sideband Energy Ratio limit</label>
                        <input type="number" id="node-input-gearSerThreshold" min="0.01" step="0.1" placeholder="1">
                        <div class="cm-help-text">A gear is reported when the summed amplitude of its first 6 sidebands on each side exceeds this multiple of the mesh amplitude (twice the limit = high). Typical: below 1 healthy; trend it per machine.</div>
                    </div>
                </div>
                <div style="margin-top: 12px; padding: 10px; background: #fff3e0; border-radius: 4px; font-size: 11px;">
                    <i class="fa fa-lightbulb" style="color: #ff9800;"></i>
                    <strong>Gear Mesh Frequency:</strong> GMF = Shaft_RPM/60 × Tooth_Count
                    <br>Sidebands at GMF ± n×Shaft_Freq indicate gear damage; the node reports their summed amplitude relative to the mesh line (<code>msg.gears[].sidebandEnergyRatio</code>). Needs the shaft speed and a frame long enough to separate the sidebands (FFT bin width below a quarter of the shaft frequency). The cepstrum peaks themselves are reported for inspection.
                </div>
            </div>
        </div>
    </div>
    
    <!-- Advanced Settings -->
    <div class="cm-section">
        <div class="cm-section-header">
            <span><i class="fa fa-cog"></i> Advanced Settings</span>
            <i class="fa fa-chevron-down cm-collapse-icon"></i>
        </div>
        <div class="cm-section-content">
            <div class="cm-config-grid">
                <div class="cm-config-item">
                    <label for="node-input-outputTopic">
                        <i class="fa fa-tag"></i> Output Topic
                    </label>
                    <input type="text" id="node-input-outputTopic" placeholder="Leave empty to preserve original">
                    <div class="cm-help-text">Set msg.topic on output (empty = keep original)</div>
                </div>
                
                <div class="cm-config-item">
                    <label for="node-input-groupBy">
                        <i class="fa fa-sitemap"></i> Group By (msg property)
                    </label>
                    <input type="text" id="node-input-groupBy" placeholder="e.g. topic (empty = single buffer)">
                    <div class="cm-help-text">One separate buffer per value, so one node can serve many devices</div>
                </div>

                <div class="cm-config-item">
                    <label for="node-input-maxGroups">
                        <i class="fa fa-list-ol"></i> Max Groups
                    </label>
                    <input type="number" id="node-input-maxGroups" min="1" step="1" placeholder="50">
                    <div class="cm-help-text">Buffer limit when grouping; least recently used is dropped</div>
                </div>

                <div class="cm-config-item">
                    <label for="node-input-debug">
                        <i class="fa fa-bug"></i> Debug Mode
                    </label>
                    <input type="checkbox" id="node-input-debug" style="width: auto; margin-top: 8px;">
                    <div class="cm-help-text">Log detailed info to Node-RED debug</div>
                </div>
                
                <div class="cm-config-item">
                    <label for="node-input-persistState">
                        <i class="fa fa-save"></i> Persist Buffer
                    </label>
                    <input type="checkbox" id="node-input-persistState" style="width: auto; margin-top: 8px;">
                    <div class="cm-help-text">Save signal buffer across restarts</div>
                </div>
            </div>
        </div>
    </div>
</script>

<script type="text/html" data-help-name="signal-analyzer">
    <p>A unified node for advanced signal analysis: FFT frequency analysis, vibration feature extraction, peak detection, and bearing fault diagnosis.</p>
    
    <h3>Analysis Modes</h3>
    <dl>
        <dt><b>FFT (Frequency Analysis)</b></dt>
        <dd>Performs Fast Fourier Transform with configurable windowing.
        <br><b>Window Functions:</b> Hann (default), Hamming, Blackman, Rectangular
        <br><b>Overlap:</b> 0-90% for continuous spectral analysis
        <br><b>Outputs:</b> Frequency peaks, dominant frequency, spectral centroid
        <br><b>Use case:</b> Detect rotating machinery faults (imbalance, misalignment, bearing defects)</dd>
        
        <dt><b>Vibration Features</b></dt>
        <dd>Calculates ISO 10816-compliant vibration metrics.
        <br><b>Outputs:</b> RMS, Peak-to-Peak, Crest Factor, Kurtosis, Skewness
        <br><b>Use case:</b> Machine health monitoring, predictive maintenance</dd>
        
        <dt><b>Peak Detection</b></dt>
        <dd>Identifies local maxima and minima with configurable thresholds.
        <br><b>Outputs:</b> Peak locations, values, and statistics
        <br><b>Use case:</b> Detect spikes, impacts, or cyclic patterns</dd>
        
        <dt><b>Envelope Analysis (Bearing Faults)</b></dt>
        <dd>Specialized bearing fault detection using envelope spectrum analysis.
        <br><b>Detects:</b> BPFO (outer race), BPFI (inner race), BSF (ball/roller), FTF (cage) faults
        <br><b>Harmonics:</b> Checks fundamental and up to 3x harmonics
        <br><b>Outputs:</b> Detected faults with severity, expected vs actual frequencies
        <br><b>Use case:</b> Predictive maintenance for rolling element bearings</dd>
        
        <dt><b>Cepstrum Analysis (Gearbox Faults)</b></dt>
        <dd>Detects periodic patterns in the frequency spectrum using cepstral analysis.
        <br><b>Detects:</b> Gear mesh frequencies (GMF), sidebands, gear damage
        <br><b>Configuration:</b>
        <ul>
            <li><b>Quefrency Range:</b> Time range to search for periodic components (0.001-0.1 sec)</li>
            <li><b>Gear Tooth Count:</b> Comma-separated tooth counts for each gear (e.g., "20,45,18")</li>
            <li><b>Peak Threshold:</b> Minimum normalized peak height to detect (0.1 = 10%)</li>
        </ul>
        <br><b>Outputs:</b> Rahmonics (cepstral peaks), gear faults with severity
        <br><b>Use case:</b> Gearbox condition monitoring, detecting localized gear damage</dd>
    </dl>
    
    <h3>FFT Configuration</h3>
    <ul>
        <li><b>FFT Size:</b> Number of samples (power of 2: 64, 128, 256, 512, 1024, 2048)</li>
        <li><b>Sample Rate:</b> Samples per second (Hz) for frequency calculation</li>
        <li><b>Window Function:</b>
            <ul>
                <li><b>Hann:</b> Good general-purpose, reduced spectral leakage</li>
                <li><b>Hamming:</b> Similar to Hann, slightly narrower main lobe</li>
                <li><b>Blackman:</b> Best sidelobe suppression, wider main lobe</li>
                <li><b>Rectangular:</b> No windowing, best frequency resolution but more leakage</li>
            </ul>
        </li>
        <li><b>Overlap:</b> Percentage of overlap between consecutive FFT frames (0-90%). Higher overlap = smoother spectral changes but more CPU usage.</li>
    </ul>
    
    <h3>Inputs</h3>
    <dl>
        <dt>msg.payload <span class="property-type">number | array</span></dt>
        <dd>Single sample value (streaming) or array of samples (batch)
        <br>Values are accumulated until window size is reached</dd>
        
        <dt>msg.timestamp <span class="property-type">number</span></dt>
        <dd>Optional timestamp for peak detection (ms)</dd>
        
        <dt>msg.reset <span class="property-type">boolean | string</span></dt>
        <dd>Set to <code>true</code> to clear the sample buffer of the group this message
        belongs to (the single buffer when grouping is off).
        <br>Set to <code>"all"</code> to clear every group at once.</dd>
        
        <dt>msg.config <span class="property-type">object</span></dt>
        <dd>Optional runtime configuration override. Allows dynamic adjustment of parameters per message:
        <pre>msg.config = {
  mode: "vibration",        // Override mode (fft/vibration/peaks/envelope/cepstrum)
  fftSize: 1024,            // Override FFT size
  sampleRate: 1000,         // Override sample rate
  vibrationThreshold: 5,    // Override vibration crest factor threshold
  peakThreshold: 0.3        // Override peak detection threshold
};</pre>
        <b>Use cases:</b> Adaptive analysis based on operating conditions or equipment type.</dd>
    </dl>
    
    <p><b>Shaft speed per message:</b> in vibration, envelope and cepstrum mode <code>msg.rpm</code> (or <code>msg.shaftSpeed</code>,
    <code>msg.config.shaftSpeed</code>) overrides the configured shaft speed, so variable-speed drives get correct fault
    frequencies and acceleration-to-velocity conversion. Bearing values (<code>msg.config.bearingBPFO</code> …,
    <code>msg.config.bearingBalls</code>, <code>bearingBallDiameter</code>, <code>bearingPitchDiameter</code>,
    <code>bearingContactAngle</code>) can be overridden the same way.</p>

    <h3>Outputs</h3>
    <ol>
        <li><b>Output 1 (Normal)</b> - Regular analysis results</li>
        <li><b>Output 2 (Anomaly/Peak)</b> - Anomalous vibration or detected peaks</li>
    </ol>

    <h3>Multiple Devices per Node (Group By)</h3>
    <p>By default the node keeps <b>one</b> sample buffer, so an interleaved stream from
    several machines would be mixed into a single analysis. Set <b>Group By</b> to a message
    property (typically <code>topic</code>) to keep an <b>independent buffer per device</b> and
    emit one result per device:</p>
    <pre>pump-01/vibration --+
pump-02/vibration --+--&gt; [signal-analyzer]  --&gt; one result per device
pump-03/vibration --+     groupBy: "topic"</pre>
    <ul>
        <li>Nested paths work too, e.g. <code>payload.deviceId</code>.</li>
        <li>Each result carries <code>msg.group</code> with the key it was computed from.</li>
        <li>Messages whose group property is missing or empty share one "ungrouped" buffer
        (<code>msg.group</code> is then <code>""</code>).</li>
        <li>Buffers fill independently: with <code>fftSize: 256</code> each device needs its
        own 256 samples before it produces a first result.</li>
        <li><b>Max Groups</b> caps memory. When exceeded, the least recently used buffer is
        dropped — size it above your expected device count.</li>
        <li>Leaving <b>Group By</b> empty preserves the previous single-buffer behaviour.</li>
    </ul>
    
    <h3>FFT Mode Output</h3>
    <dl>
        <dt>msg.peaks <span class="property-type">array</span></dt>
        <dd>Detected frequency peaks:
        <pre>[{
  "frequency": 50.0,
  "magnitude": 0.85,
  "normalized": 1.0
}, ...]</pre></dd>
        
        <dt>msg.dominantFrequency <span class="property-type">number</span></dt>
        <dd>Frequency with highest magnitude (Hz)</dd>
        
        <dt>msg.features <span class="property-type">object</span></dt>
        <dd>Spectral features:
        <br>• <code>spectralCentroid</code>: "Center of mass" of spectrum (Hz)
        <br>• <code>spectralSpread</code>: Frequency distribution width
        <br>• <code>rms</code>: Overall spectrum energy
        <br>• <code>crestFactor</code>: Spectral peakedness
        <br>• <code>totalEnergy</code>: Sum of squared magnitudes</dd>
        
        <dt>msg.frequencies, msg.magnitudes <span class="property-type">array</span></dt>
        <dd>Full spectrum (only if Output Format = "Full")</dd>
    </dl>
    
    <h3>Vibration Mode Output</h3>
    <p>All features in <code>msg.payload</code> object:</p>
    <dl>
        <dt>rms <span class="property-type">number</span></dt>
        <dd>Root Mean Square - overall vibration level (ISO 10816)</dd>
        
        <dt>peakToPeak <span class="property-type">number</span></dt>
        <dd>Maximum range of vibration</dd>
        
        <dt>crestFactor <span class="property-type">number</span></dt>
        <dd>Peak/RMS ratio. High values (>6) indicate impulsive events.
        <br><b>Normal:</b> 3-4 | <b>Warning:</b> 5-6 | <b>Critical:</b> >6</dd>
        
        <dt>kurtosis <span class="property-type">number</span></dt>
        <dd>Distribution "peakedness". High values indicate bearing faults.
        <br><b>Normal:</b> ~3 | <b>Warning:</b> >4 | <b>Critical:</b> >6</dd>
        
        <dt>skewness <span class="property-type">number</span></dt>
        <dd>Distribution asymmetry. Non-zero indicates asymmetric faults.</dd>
        
        <dt>formFactor, impulseFactor <span class="property-type">number</span></dt>
        <dd>Additional shape metrics for advanced analysis</dd>
        
        <dt>sampleEntropy <span class="property-type">number</span></dt>
        <dd>Signal complexity measure. Lower = more regular/periodic, Higher = more random.
        <br><b>Healthy bearing:</b> Low entropy | <b>Faulty bearing:</b> Higher entropy</dd>
        
        <dt>autocorrelation <span class="property-type">array</span></dt>
        <dd>Autocorrelation function (ACF) for first 10 lags. Detects periodicity in signal.</dd>
        
        <dt>periodicity <span class="property-type">object</span></dt>
        <dd>Detected periodic patterns: <code>{ detected: true/false, period: lag, strength: 0-1 }</code></dd>
        
        <dt>healthScore <span class="property-type">number</span></dt>
        <dd>Simplified 0-100 health indicator based on all metrics</dd>
        
        <dt>iso20816 <span class="property-type">object</span></dt>
        <dd>ISO 20816-3 vibration severity assessment (<code>iso10816</code> is kept as an alias of the same object):
        <pre>{
  "zone": "A"|"B"|"C"|"D"|"N/A",
  "severity": "good"|"acceptable"|"warning"|"critical"|"unknown",
  "recommendation": "...",
  "rmsVelocity": 2.5,
  "machineClass": "group2_rigid",
  "standard": "ISO 20816-3",
  "limits": { "ab": 1.4, "bc": 2.8, "cd": 4.5 },
  "zoneProgress": 45,
  "conversion": "none"|"scale"|"spectral-integration"|"single-frequency",
  "band": [10, 500],
  "isAlarm": false,
  "isWarning": false,
  "inputUnit": "mm_s",
  "isValid": true
}</pre>
        <br><b>Zones:</b>
        <br>• <b>Zone A:</b> Newly commissioned machine condition
        <br>• <b>Zone B:</b> Acceptable for unrestricted long-term operation
        <br>• <b>Zone C:</b> Acceptable only for limited periods
        <br>• <b>Zone D:</b> Vibration causes damage - immediate action required
        <br>• <b>N/A:</b> Input unit is raw/dimensionless - ISO evaluation not valid</dd>
    </dl>
    
    <h3>Input Data Unit Conversion</h3>
    <p>The severity rating needs broadband RMS velocity in mm/s (10–1000 Hz). The node converts:</p>
    <table>
        <tr><th>Input Unit</th><th>Conversion</th></tr>
        <tr><td>Velocity (mm/s)</td><td>Direct use - no conversion</td></tr>
        <tr><td>Velocity (m/s)</td><td>× 1000</td></tr>
        <tr><td>Acceleration (g, m/s²)</td><td>Frame payloads (array, ≥ 16 samples, sampling rate &gt; 20 Hz): spectral integration — each FFT bin divided by 2πf, RMS over 10 Hz … min(1000 Hz, f<sub>s</sub>/2). Scalar streams: v = a / (2π · f<sub>shaft</sub>) (marked <code>single-frequency</code>).</td></tr>
        <tr><td>Raw/Dimensionless</td><td>Rating disabled</td></tr>
    </table>

    <table>
        <tr><th>Machine group</th><th>Foundation</th><th>A/B</th><th>B/C</th><th>C/D</th></tr>
        <tr><td>Group 1: 300 kW – 50 MW</td><td>rigid</td><td>2.3</td><td>4.5</td><td>7.1</td></tr>

    <h3>Peak Detection Output</h3>
    <dl>
        <dt>msg.isPeak <span class="property-type">boolean</span></dt>
        <dd>True if current sample is a detected peak</dd>
        
        <dt>msg.peaks <span class="property-type">array</span></dt>
        <dd>All detected peaks in window:
        <pre>[{
  "index": 42,
  "value": 3.5,
  "timestamp": 1704067200000,
  "direction": "positive"
}, ...]</pre></dd>
        
        <dt>msg.stats <span class="property-type">object</span></dt>
        <dd>Peak statistics:
        <br>• <code>averagePeakHeight</code>: Mean peak value
        <br>• <code>maxPeakHeight</code>, <code>minPeakHeight</code>
        <br>• <code>peakFrequency</code>: Peaks per sample</dd>
    </dl>
    
    <h3>Envelope Mode Output</h3>
    <dl class="message-properties">
        <dt>bearingFaults <span class="property-type">array</span></dt>
        <dd>Matches between envelope-spectrum peaks and the expected frequencies. Peaks count only when they exceed
        <b>Peak Floor</b> × the local spectral noise floor (30th percentile of ±0.4 % of the spectrum), matching tolerance is
        5 % but at most 0.15 × shaft frequency and at least 1.5 bins, harmonics of a bearing line count only when its
        fundamental is present, and a line that also sits on a shaft harmonic carries <code>coincidesWith1X</code>.
        Each entry carries <code>type</code>, <code>harmonic</code>, <code>description</code>, <code>expectedFreq</code>,
        <code>detectedFreq</code>, <code>magnitude</code>, <code>severity</code>. Types:
        <br>• <b>BPFO / BPFI / BSF / FTF</b> — bearing line (fundamental to 3rd harmonic)
        <br>• <b>BPFI-Sideband</b> — BPFI harmonic with a ±1X / ±2X sideband (<code>sideband</code> = ±1, ±2): inner-race defect passing through the load zone, a firmer diagnosis than the line alone
        <br>• <b>1X</b> imbalance, <b>2X</b> misalignment
        <br>• <b>Looseness</b> — four or more harmonics of 1X present (<code>harmonics</code> lists them)
        <br>• <b>SubSynchronous</b> — component at 0.38–0.48X (<code>order</code>): oil whirl or rub; suppressed when it matches the configured FTF</dd>
        <dt>bearingFreqs <span class="property-type">object</span></dt>
        <dd><code>{ BPFO, BPFI, BSF, FTF, source }</code> — the frequencies used, <code>source</code> is
        <code>manual</code>, <code>geometry</code>, <code>mixed</code> or <code>none</code></dd>
        <dt>shaftSpeed / shaftFrequency <span class="property-type">number</span></dt>
        <dd>RPM and Hz actually used for this analysis</dd>
    </dl>

    <table>
        <tr><th>Fault Type</th><th>Typical Frequency</th></tr>
        <tr><td>Imbalance</td><td>1× RPM</td></tr>
        <tr><td>Misalignment</td><td>2× RPM</td></tr>
